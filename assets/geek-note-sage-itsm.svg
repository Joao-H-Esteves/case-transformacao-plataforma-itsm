<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8C7A3"/>
      <stop offset="100%" stop-color="#A98E67"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#91A86A"/>
      <stop offset="100%" stop-color="#617649"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -2; 0 0" dur="3.2s" repeatCount="indefinite"/>

    <!-- robe/body -->
    <path d="M45 116 Q80 94 115 116 L129 151 H31 Z" fill="url(#robe)"/>
    <path d="M62 111 L80 139 L98 111" fill="none" stroke="#7C664A" stroke-width="4"/>

    <!-- head -->
    <ellipse cx="80" cy="75" rx="36" ry="34" fill="url(#skin)"/>

    <!-- long ears -->
    <path d="M49 64 Q24 50 11 58 Q28 73 49 78 Z" fill="#728955"/>
    <path d="M111 64 Q136 50 149 58 Q132 73 111 78 Z" fill="#728955"/>
    <path d="M44 68 Q27 61 20 62" fill="none" stroke="#A5B77F" stroke-width="4" stroke-linecap="round"/>
    <path d="M116 68 Q133 61 140 62" fill="none" stroke="#A5B77F" stroke-width="4" stroke-linecap="round"/>

    <!-- brow wrinkles -->
    <path d="M61 58 Q70 52 79 57" fill="none" stroke="#53643F" stroke-width="2" stroke-linecap="round"/>
    <path d="M81 57 Q90 52 99 58" fill="none" stroke="#53643F" stroke-width="2" stroke-linecap="round"/>
    <path d="M73 48 Q80 44 87 48" fill="none" stroke="#53643F" stroke-width="2" stroke-linecap="round"/>

    <!-- eyes -->
    <g>
      <ellipse cx="66" cy="72" rx="5" ry="4" fill="#1C1C1C"/>
      <ellipse cx="94" cy="72" rx="5" ry="4" fill="#1C1C1C"/>
      <animate attributeName="opacity" values="1;1;0.15;1;1" keyTimes="0;0.43;0.46;0.49;1" dur="4.5s" repeatCount="indefinite"/>
    </g>

    <!-- nose / mouth -->
    <path d="M77 81 Q80 84 83 81" fill="none" stroke="#475639" stroke-width="2" stroke-linecap="round"/>
    <path d="M68 91 Q80 96 92 91" fill="none" stroke="#3F4C33" stroke-width="2.5" stroke-linecap="round"/>

    <!-- octo tentacles peeking out -->
    <path d="M53 137 Q41 147 49 155" fill="none" stroke="#728955" stroke-width="6" stroke-linecap="round"/>
    <path d="M107 137 Q119 147 111 155" fill="none" stroke="#728955" stroke-width="6" stroke-linecap="round"/>

    <!-- small project scroll -->
    <rect x="101" y="116" width="28" height="20" rx="3" fill="#F0E4CB" stroke="#7C664A" stroke-width="2"/>
    <path d="M106 122 H124 M106 127 H120 M106 132 H123" stroke="#A85D3D" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>